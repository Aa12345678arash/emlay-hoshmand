plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.arash.emlayhoshmand'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.arash.emlayhoshmand'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-test'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
